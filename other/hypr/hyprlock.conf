general {
    grace = 3
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/assets/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    outer_color = rgba(7dcfffee)
    inner_color = rgba(26, 27, 38, 0.8)
    font_color = rgba(c0caf5ee)
    placeholder_text = <i>locked</i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = rgba(c0caf5ee)
    font_size = 64
    font_family = FiraCode Nerd Font Mono
    position = 0, 100
    halign = center
    valign = center
}
