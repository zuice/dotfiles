$terminal = ghostty
$fileManager = dolphin
$menu = rofi -show drun
$mainMod = SUPER

#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = ~/.config/waybar/scripts/scale-watcher.sh
exec-once = swaybg -i ~/.config/hypr/assets/wallpaper.jpg -m fill
exec-once = swaync
exec-once = ~/.config/hypr/scripts/hypridle-launch.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = blueman-applet
exec-once = udiskie -t
exec-once = [workspace 1 silent] ghostty
exec-once = [workspace 2 silent] zen-browser
exec-once = [workspace 3 silent] discord --enable-features=UseOzonePlatform --ozone-platform=wayland
exec-once = [workspace 4 silent] steam -silent

###################
### ENVIRONMENT ###
###################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,breeze_cursors
env = HYPRCURSOR_THEME,breeze_cursors
env = ELECTRON_OZONE_PLATFORM_HINT,auto

#############
### MISC ###
#############

ecosystem {
    no_update_news = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

################
### MONITORS ###
################

monitor = ,highrr,auto,auto

###################
### LOOK & FEEL ###
###################

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(3b4261aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,    default
    animation = border,        1, 5.39,  easeOutQuint
    animation = windows,       1, 4.79,  easeOutQuint
    animation = windowsIn,     1, 4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49,  linear,       popin 87%
    animation = fadeIn,        1, 1.73,  almostLinear
    animation = fadeOut,       1, 1.46,  almostLinear
    animation = fade,          1, 3.03,  quick
    animation = layers,        1, 3.81,  easeOutQuint
    animation = layersIn,      1, 4,     easeOutQuint, fade
    animation = layersOut,     1, 1.5,   linear,       fade
    animation = fadeLayersIn,  1, 1.79,  almostLinear
    animation = fadeLayersOut, 1, 1.39,  almostLinear
    animation = workspaces,    1, 1.94,  almostLinear, fade
    animation = workspacesIn,  1, 1.21,  almostLinear, fade
    animation = workspacesOut, 1, 1.94,  almostLinear, fade
    animation = zoomFactor,    1, 7,     quick
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

############
### INPUT #
############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        scroll_factor = 0.3
        tap-to-click = false
        clickfinger_behavior = true
    }
}

gesture = 3, horizontal, workspace

device {
    name = compx-2.4g-wireless-receiver-1
    sensitivity = -0.60
    accel_profile = flat
}

device {
    name = compx-2.4g-dual-mode-mouse-1
    sensitivity = -0.60
    accel_profile = flat
}

device {
    name = compx-2.4g-dual-mode-mouse
    sensitivity = -0.60
    accel_profile = flat
}

device {
    name = keychron-keychron-g3
    sensitivity = -0.60
    accel_profile = flat
}

device {
    name = keychron-keychron-g3-keyboard-1
    sensitivity = -0.60
    accel_profile = flat
}

device {
    name = keychron-keychron-ultra-link-8k
    sensitivity = -0.60
    accel_profile = flat
}

device {
    name = keychron-keychron-ultra-link-8k-keyboard-1
    sensitivity = -0.60
    accel_profile = flat
}

################
### KEYBINDS ###
################

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, F, fullscreen,
bind = $mainMod, M, exit,
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, comma, focusmonitor, +1
bind = $mainMod, period, focusmonitor, -1

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, comma, movewindow, mon:+1
bind = $mainMod SHIFT, period, movewindow, mon:-1

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, Print, exec, grim - | wl-copy
bind = $mainMod SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y%m%d_%H%M%S.png') && notify-send "Screenshot saved"

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, slash, submap, resize
submap = resize
bind = , h, resizeactive, -30 0
bind = , l, resizeactive, 30 0
bind = , k, resizeactive, 0 -30
bind = , j, resizeactive, 0 30
bind = , escape, submap, reset
submap = reset

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , switch:Lid Switch, exec, ~/.config/hypr/scripts/lid-switch.sh

#########################
### WINDOW RULES      ###
#########################

windowrule = workspace 1, match:class com.mitchellh.ghostty
windowrule = workspace 2, match:class app.zen_browser.zen
windowrule = workspace 3, match:class discord
windowrule = workspace 4, match:class steam
windowrule = workspace 4, match:class Steam
windowrule = workspace 5, match:class dolphin
windowrule = workspace 5, match:fullscreen true
